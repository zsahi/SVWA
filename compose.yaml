name: svwa
services:
  web:
    image: sahi/svwa:local
    build: .
    ports:
      - "127.0.0.1:8888:80"
    environment:
      DB_HOST: db
      DB_NAME: svwa
      DB_USER: svwa
      DB_PASSWORD: svwa_lab
      ACCOUNT_DB_NAME: svwa_accounts
      ACCOUNT_DB_USER: svwa_accounts
      ACCOUNT_DB_PASSWORD: svwa_accounts_local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/uploads
    restart: unless-stopped
  db:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: svwa
      MYSQL_USER: svwa
      MYSQL_PASSWORD: svwa_lab
      MYSQL_ROOT_PASSWORD: svwa_root_lab
    volumes:
      - database:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/accounts.sql:/docker-entrypoint-initdb.d/accounts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
volumes:
  database:
  uploads:
